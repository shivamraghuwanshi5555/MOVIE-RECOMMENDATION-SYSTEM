<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="600" height="180" fill="#000000"/>

  <!-- Clapperboard icon -->
  <g transform="translate(30,45)">
    <!-- Board body -->
    <rect x="0" y="30" width="90" height="65" rx="6" fill="#e50914"/>
    <!-- Top clapper bar -->
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#1a1a1a" transform="rotate(-8 0 24)"/>
    <!-- Diagonal stripes on clapper -->
    <g transform="rotate(-8 0 24)">
      <rect x="0" y="0" width="14" height="24" fill="#ffffff"/>
      <rect x="24" y="0" width="14" height="24" fill="#ffffff"/>
      <rect x="48" y="0" width="14" height="24" fill="#ffffff"/>
      <rect x="72" y="0" width="14" height="24" fill="#ffffff"/>
    </g>
    <!-- Play triangle on board -->
    <polygon points="35,50 35,80 65,65" fill="#ffffff"/>
  </g>

  <!-- Title text -->
  <text x="150" y="85" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#e50914" letter-spacing="1">MOVIE</text>
  <text x="150" y="130" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="1">RECOMMENDER</text>

  <!-- Subtle tagline -->
  <text x="150" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#999999" letter-spacing="2">BOLLYWOOD · HOLLYWOOD · SOUTH</text>
</svg>